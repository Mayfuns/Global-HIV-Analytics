name: Unpack Global HIV dashboard images

on:
  push:
    paths:
      - '.github/workflows/unpack-global-hiv-dashboard.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack dashboard images
        shell: bash
        run: |
          set -e
          test -f "01_dashboard/global-hiv-dashboard-pages.zip"
          tmpdir="$(mktemp -d)"
          unzip -o "01_dashboard/global-hiv-dashboard-pages.zip" -d "$tmpdir"
          cp "$tmpdir/global-hiv-overview.png" "01_dashboard/global-hiv-overview.png"
          cp "$tmpdir/global-hiv-geographic-burden.png" "01_dashboard/global-hiv-geographic-burden.png"
          cp "$tmpdir/global-hiv-treatment-outcomes.png" "01_dashboard/global-hiv-treatment-outcomes.png"
          rm -f "01_dashboard/global-hiv-dashboard-pages.zip"

      - name: Commit extracted images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Unpack original Global HIV dashboard images"
            git push
          fi

# one-off trigger
